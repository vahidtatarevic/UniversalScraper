[project]
name = "universalscraper"
version = "1.0.2"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "pyjwt",
    "pwdlib[argon2]",
    "python-dotenv",
    "beautifulsoup4",
    "curl_cffi",
    "python-multipart>=0.0.32",
    "google-auth>=2.62.2",
    "requests>=2.34.2",
    "email-validator>=2.4.0",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2>=2.16.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["I"]
